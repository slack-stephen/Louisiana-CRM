<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f7f7f6;--bg3:#f0efed;
  --text:#111111;--text2:#6b7280;--text3:#aaaaaa;
  --border:#e8e8e6;--border2:#d5d5d0;
  --blue:#1a56db;--blue-bg:#eff4ff;--blue-text:#1e429f;
  --green:#0e7c4a;--green-bg:#f0fdf6;--green-text:#065f46;
  --red:#b91c1c;
  --purple:#6d28d9;--purple-bg:#f5f3ff;
  --orange:#c2410c;--orange-bg:#fff7ed;
  --r:12px;--rs:8px;--rxs:6px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
    --text:#f5f5f7;--text2:#98989d;--text3:#5a5a5e;
    --border:#38383a;--border2:#48484a;
    --blue:#4f8ef7;--blue-bg:#1c2f5e;--blue-text:#93b4fb;
    --green:#34d399;--green-bg:#052e1c;--green-text:#6ee7b7;
    --red:#f87171;
    --purple:#a78bfa;--purple-bg:#2e1f5e;
    --orange:#fb923c;--orange-bg:#431407;
  }
}
html,body{height:100%;background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--text);font-size:16px;-webkit-font-smoothing:antialiased}
#app{max-width:600px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:50;flex-shrink:0}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.topbar-sub{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-top:2px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;transition:background .3s}
.sync-dot.saving{background:#f59e0b;animation:pulse 1s infinite}
.sync-dot.error{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.scrollable{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav{display:flex;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{flex:1;padding:9px 2px 7px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3);font-size:10px;font-weight:600;font-family:inherit}
.nav-btn.on{color:var(--blue)}
.nav-btn svg{width:23px;height:23px}
.slbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:14px 16px 6px;display:block}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;margin:0 12px 8px}
.card-tap{cursor:pointer;transition:background .12s}.card-tap:active{background:var(--bg2)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px 0}
.metric{background:var(--bg2);border-radius:var(--rs);padding:14px;cursor:pointer;transition:opacity .15s}.metric:active{opacity:.7}
.metric-val{font-size:26px;font-weight:700;line-height:1}
.metric-lbl{font-size:12px;color:var(--text2);margin-top:5px}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-t1{background:var(--blue-bg);color:var(--blue-text)}
.b-t2{background:var(--green-bg);color:var(--green-text)}
.b-t3{background:var(--bg2);color:var(--text2)}
.filter-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.filter-bar::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;border:1px solid var(--border2);border-radius:20px;background:none;font-size:13px;cursor:pointer;color:var(--text2);white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .12s}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.search-wrap{position:relative;padding:10px 12px 4px;flex-shrink:0}
.search-input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--bg2);font-size:15px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s}
.search-input:focus{border-color:var(--blue);background:var(--bg)}
.search-icon{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;width:18px;height:18px}
.btn{padding:9px 18px;border:1px solid var(--border2);border-radius:var(--rs);background:none;font-size:14px;cursor:pointer;color:var(--text);font-weight:500;font-family:inherit;transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.btn:active{opacity:.75}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-red{color:var(--red);border-color:transparent;background:none}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:var(--rxs)}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:var(--rxs)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);cursor:pointer;background:none;border:none;font-family:inherit;font-weight:500;padding:14px 16px 6px;flex-shrink:0}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin-bottom:5px}
.fi{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--rs);font-size:14px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;-webkit-appearance:none;transition:border-color .15s}
.fi:focus{border-color:var(--blue)}
textarea.fi{min-height:78px;resize:vertical;line-height:1.5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sched-grid{display:grid;grid-template-columns:40px 1fr;gap:6px 10px;align-items:center}
.sched-day{font-size:12px;font-weight:700;color:var(--text2)}
.subtabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;flex-shrink:0}
.subtab{flex:1;padding:10px 4px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap;text-align:center;transition:color .12s}
.subtab.on{color:var(--blue);border-bottom-color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-handle{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:13px auto 18px}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:18px}
.contact-card{background:var(--bg2);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:opacity .12s}.contact-card:active{opacity:.7}
.contact-name{font-size:14px;font-weight:700}
.contact-detail{font-size:13px;color:var(--text2);margin-top:3px}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}.task-row:last-child{border-bottom:none}
.task-circle{width:24px;height:24px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;background:none;transition:all .15s}
.task-circle.done{background:var(--blue);border-color:var(--blue)}
.task-text{font-size:14px;line-height:1.4;flex:1}
.task-text.done{text-decoration:line-through;color:var(--text3)}
.task-meta{font-size:11px;color:var(--text3);margin-top:3px}
.task-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:0;flex-shrink:0}
.date-box{min-width:48px;text-align:center;background:var(--bg2);border-radius:var(--rs);padding:8px 5px;flex-shrink:0}
.date-month{font-size:10px;color:var(--text2);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.date-day{font-size:22px;font-weight:800;line-height:1.1}
.log-row{padding:12px 0;border-bottom:1px solid var(--border)}.log-row:last-child{border-bottom:none}
.empty{text-align:center;padding:52px 20px;color:var(--text2);font-size:15px}
.empty-icon{font-size:40px;display:block;margin-bottom:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.tag-up{background:var(--blue-bg);color:var(--blue-text)}
.tag-past{background:var(--bg2);color:var(--text2)}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;margin-top:6px}
.row{display:flex;gap:12px;align-items:flex-start}
.role-badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.loc-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.loc-num{font-size:11px;font-weight:700;color:var(--text3);width:16px;flex-shrink:0;text-align:center}
/* Facility styles */
.fac-type-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600;white-space:nowrap}
</style>
</head>

function setSyncUI(s) {

function roleBadge(role) {

  if(r.includes('pa')||r.includes('np')||r.includes('nurse')||r.includes('cst')){bg='var(--blue-bg)';col='var(--blue-text)';}
  else if(r.includes('manager')||r.includes('scheduler')||r.includes('rep')||r.includes('contact')){bg='var(--purple-bg)';col='var(--purple)';}
  else{bg='var(--bg2)';col='var(--text2)';}

}

function facTypeBadge(type) {
  const t=(type||'').toLowerCase();

  if(t==='hospital'){bg='var(--blue-bg)';col='var(--blue-text)';}
  else if(t==='asc'){bg='var(--green-bg)';col='var(--green-text)';}
  else if(t==='clinic'){bg='var(--orange-bg)';col='var(--orange)';}

function facIcon(type) {

// Build <optgroup> grouped-by-city facility dropdown HTML
function buildFacOptions(selectedId) {
  const cities = [...new Set(ST.facs.map(f=>f.city))].sort();
  let html = `<option value="">— None —</option>`;
  cities.forEach(city => {
    const cityFacs = ST.facs.filter(f=>f.city===city);
    if(!cityFacs.length) return;
    html += `<optgroup label="${city}">`;
    cityFacs.forEach(f => {
      html += `<option value="${f.id}" ${f.id===selectedId?'selected':''}>${f.name}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

// Get surgeon's clinic_locs and or_locs arrays from prefs
function getSurgLocs(sid) {
  const p = ST.prefs[sid] || {};
  return {
    clinic_locs: p.clinic_locs || ['','',''],
    or_locs:     p.or_locs     || ['','',''],
  };
}

// Get all facility IDs a surgeon is linked to (clinic + OR)
function getSurgFacIds(sid) {
  const {clinic_locs, or_locs} = getSurgLocs(sid);
  return [...clinic_locs, ...or_locs].filter(Boolean);
}

// Get all surgeons at a given facility ID
function getSurgsAtFac(fid) {
  return SURGS.filter(s => getSurgFacIds(s.id).includes(fid));
}

function makeICS(title,date,st,et,loc,notes) {
  const d=date.replace(/-/g,''), s=((st||'08:00').replace(':',''))+'00', e=((et||'09:00').replace(':',''))+'00';
  const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//LA CRM//EN\nBEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${d}T${s}\nDTEND:${d}T${e}\nLOCATION:${loc||''}\nDESCRIPTION:${notes||''}\nEND:VEVENT\nEND:VCALENDAR`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download=title.replace(/[^a-z0-9]/gi,'_')+'.ics'; a.click();
}

async function dbLoad() {
  setSyncUI('saving');
  try {
    const [logs,appts,pers,prefs,sc,tasks,facsRes,facPersRes] = await Promise.all([
      _SB.from('crm_logs').select('*').order('date',{ascending:false}),
      _SB.from('crm_appts').select('*').order('date',{ascending:true}),
      _SB.from('crm_personnel').select('*'),
      _SB.from('crm_prefs').select('*'),
      _SB.from('crm_surgeon_contacts').select('*'),
      _SB.from('crm_tasks').select('*').order('created_at',{ascending:false}),
      _SB.from('crm_facilities').select('*').catch(()=>({data:null,error:true})),
      _SB.from('crm_facility_personnel').select('*').catch(()=>({data:null,error:true})),
    ]);
    ST.logs  = logs.data  || [];
    ST.appts = appts.data || [];
    ST.pers  = (pers.data && pers.data.length) ? pers.data : [...DEF_PERS];
    if (!pers.data || !pers.data.length) for(const p of DEF_PERS) await _SB.from('crm_personnel').upsert(p);
    ST.prefs = {}; (prefs.data||[]).forEach(r => ST.prefs[r.surgeon_id]=r);
    ST.sc    = {}; (sc.data||[]).forEach(r => { if(!ST.sc[r.surgeon_id])ST.sc[r.surgeon_id]=[]; ST.sc[r.surgeon_id].push(r); });
    ST.tasks = tasks.data || [];
    if (!facsRes.error && facsRes.data !== null) {
      ST.facs = facsRes.data.length ? facsRes.data : [...DEF_FACS];
      if (!facsRes.data.length) for(const f of DEF_FACS) await _SB.from('crm_facilities').upsert(f);
    } else {
      ST.facs = [...DEF_FACS];
    }
    ST.fac_pers = {};
    if (!facPersRes.error && facPersRes.data) {
      facPersRes.data.forEach(r => {
        if(!ST.fac_pers[r.facility_id]) ST.fac_pers[r.facility_id]=[];
        ST.fac_pers[r.facility_id].push(r.personnel_id);
      });
    }
    setSyncUI('ok'); render();
  } catch(e) {
    setSyncUI('error');
    $('content').innerHTML=`<div class="scrollable"><div class="empty"><span class="empty-icon">⚠️</span>Could not connect to database.<br><small style="color:var(--text3)">${e.message}</small></div></div>`;
  }
}

async function dbSave(table,data) { setSyncUI('saving'); try{ const{error}=await _SB.from(table).upsert(data); if(error)throw error; setSyncUI('ok'); }catch(e){setSyncUI('error');console.error(e);} }
async function dbDel(table,id)   { setSyncUI('saving'); try{ const{error}=await _SB.from(table).delete().eq('id',id); if(error)throw error; setSyncUI('ok'); }catch(e){setSyncUI('error');console.error(e);} }
async function saveFacPersLink(fid,pid){const row={id:`fp_${fid}_${pid}`,facility_id:fid,personnel_id:pid};try{await _SB.from('crm_facility_personnel').upsert(row);}catch(e){console.error(e);}}
async function delFacPersLink(fid,pid){try{await _SB.from('crm_facility_personnel').delete().eq('facility_id',fid).eq('personnel_id',pid);}catch(e){console.error(e);}}

function buildDash() {
  const now=new Date(); now.setHours(0,0,0,0);
  const ua=ST.appts.filter(a=>new Date(a.date+'T00:00:00')>=now).sort((a,b)=>a.date.localeCompare(b.date));
  const tt=ST.tasks.filter(t=>t.task_date===tod()&&!t.done);
  const rl=[...ST.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const cits=[...new Set(SURGS.map(s=>s.city))].sort();
  let h=`<div class="scrollable"><div class="metrics">
    <div class="metric" onclick="go('surgs')"><div class="metric-val">${SURGS.length}</div><div class="metric-lbl">Surgeons</div></div>
    <div class="metric" onclick="go('facs')"><div class="metric-val">${ST.facs.length}</div><div class="metric-lbl">Facilities</div></div>
    <div class="metric" onclick="go('tasks')"><div class="metric-val">${tt.length}</div><div class="metric-lbl">Tasks today</div></div>
    <div class="metric" onclick="go('sched')"><div class="metric-val">${ua.length}</div><div class="metric-lbl">Upcoming appts</div></div>
  </div>`;
  if(ua.length){h+=`<span class="slbl">Upcoming appointments</span>`;ua.slice(0,3).forEach(a=>{const dt=new Date(a.date+'T00:00:00');h+=`<div class="card"><div class="row"><div class="date-box"><div class="date-month">${dt.toLocaleDateString('en-US',{month:'short'})}</div><div class="date-day">${dt.getDate()}</div></div><div style="flex:1"><div style="font-size:14px;font-weight:700">${a.title}</div><div style="font-size:13px;color:var(--text2)">${a.surgeon_name||''}${a.location?' · '+a.location:''}</div></div></div></div>`;});}
  if(rl.length){h+=`<span class="slbl">Recent activity</span>`;rl.forEach(l=>{h+=`<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--border)"><div class="act-dot"></div><div><div style="font-size:14px;font-weight:700">${l.surgeon_name}</div><div style="font-size:12px;color:var(--text2)">${fmtDate(l.date)} · ${l.type||'Call'}</div>${l.notes?`<div style="font-size:13px;color:var(--text2);margin-top:2px">${l.notes.slice(0,72)}</div>`:''}</div></div>`;});}
  h+=`<span class="slbl">Territory</span>`;
  cits.forEach(city=>{const cnt=SURGS.filter(s=>s.city===city).length;const tier=SURGS.find(s=>s.city===city)?.tier||3;h+=`<div class="card card-tap" style="display:flex;justify-content:space-between;align-items:center" onclick="goCity('${city}')"><div><div style="font-size:15px;font-weight:700">${city}</div><div style="font-size:13px;color:var(--text2)">${cnt} surgeon${cnt!==1?'s':''}</div></div>${tbadge(tier)}</div>`;});
  return h+'</div>';
}

function buildTasksPage(){return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div style="display:flex;gap:8px;padding:14px 12px 6px;flex-shrink:0"><input type="text" id="tq-inp" class="fi" style="flex:1" placeholder="Quick add task for today…" onkeydown="if(event.key==='Enter')quickTask()" autocomplete="off"><button class="btn btn-blue" onclick="quickTask()">Add</button></div><div class="filter-bar" id="task-bar" style="flex-shrink:0"><button class="pill ${ST.tfilt==='today'?'on':''}" data-tfilt="today">Today</button><button class="pill ${ST.tfilt==='open'?'on':''}" data-tfilt="open">All open</button><button class="pill ${ST.tfilt==='done'?'on':''}" data-tfilt="done">History</button></div><div id="task-list" class="scrollable">${buildTaskCards()}</div></div>`;}
function buildTaskCards(){let list=[...ST.tasks];if(ST.tfilt==='today')list=list.filter(t=>t.task_date===tod());else if(ST.tfilt==='open')list=list.filter(t=>!t.done);else list=list.filter(t=>t.done);list=asc(list,'title');if(!list.length)return`<div class="empty"><span class="empty-icon">✅</span>${ST.tfilt==='today'?'No tasks today.':'No tasks found.'}</div>`;return list.map(t=>`<div class="task-row"><button class="task-circle ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</button><div style="flex:1"><div class="task-text ${t.done?'done':''}">${t.title}</div><div class="task-meta">${t.task_date?fmtDate(t.task_date):''}${t.notes?' · '+t.notes:''}</div></div><button class="task-del" onclick="delTask('${t.id}')">×</button></div>`).join('');}
async function quickTask(){const inp=$('tq-inp');const title=(inp?.value||'').trim();if(!title)return;const e={id:'t'+Date.now(),title,task_date:tod(),notes:'',done:false,created_at:new Date().toISOString()};ST.tasks.unshift(e);inp.value='';await dbSave('crm_tasks',e);const el=$('task-list');if(el)el.innerHTML=buildTaskCards();}
async function toggleTask(id){const t=ST.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;await dbSave('crm_tasks',t);const el=$('task-list');if(el)el.innerHTML=buildTaskCards();}
async function delTask(id){ST.tasks=ST.tasks.filter(t=>t.id!==id);await dbDel('crm_tasks',id);const el=$('task-list');if(el)el.innerHTML=buildTaskCards();}
function openTaskModal(){sheet(`<div class="sheet-title">Add task</div><div class="fg"><label>Task</label><input type="text" id="tm-t" class="fi" placeholder="What needs to be done?"></div><div class="fg"><label>Date</label><input type="date" id="tm-d" class="fi" value="${tod()}"></div><div class="fg"><label>Notes (optional)</label><textarea id="tm-n" class="fi"></textarea></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="cls()">Cancel</button><button class="btn btn-blue" style="flex:1" onclick="saveTask()">Add task</button></div>`,'tm-t');}
async function saveTask(){const title=gv('tm-t').trim();if(!title){alert('Title required');return;}const e={id:'t'+Date.now(),title,task_date:gv('tm-d'),notes:gv('tm-n'),done:false,created_at:new Date().toISOString()};ST.tasks.unshift(e);await dbSave('crm_tasks',e);cls();const el=$('task-list');if(el)el.innerHTML=buildTaskCards();}

function buildSurgListPage(){const cits=['All',...new Set(SURGS.map(s=>s.city))].sort((a,b)=>a==='All'?-1:a.localeCompare(b));return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div class="search-wrap"><svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input type="text" class="search-input" id="surg-search" placeholder="Search by name, group, or city…" value="${ST.sq}" oninput="onSurgSearch(this.value)" autocomplete="off"></div><div class="filter-bar" id="surg-pills">${cits.map(c=>`<button class="pill ${ST.sfilt===c?'on':''}" data-city="${c}">${c}</button>`).join('')}</div><div id="surg-results" class="scrollable">${buildSurgCards()}</div></div>`;}

function buildSurgCards(){
  const filtered=asc(SURGS,'name').filter(s=>{const ok=ST.sfilt==='All'||s.city===ST.sfilt;const q=ST.sq.toLowerCase();return ok&&(!q||s.name.toLowerCase().includes(q)||s.group.toLowerCase().includes(q)||s.city.toLowerCase().includes(q));});
  if(!filtered.length)return`<div class="empty"><span class="empty-icon">🔍</span>No surgeons match.</div>`;
  const groups=[...new Set(filtered.map(s=>s.group))].sort();
  let h='';
  groups.forEach(g=>{
    h+=`<span class="slbl">${g}</span>`;
    filtered.filter(s=>s.group===g).forEach(s=>{
      const last=ST.logs.filter(l=>l.surgeon_id===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const p=ST.prefs[s.id]||{};
      const clocs=(p.clinic_locs||[]).filter(Boolean);
      const olocs=(p.or_locs||[]).filter(Boolean);
      h+=`<div class="card card-tap" onclick="openSurg('${s.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:0">
            <div style="font-size:15px;font-weight:700">${s.name}</div>
            <div style="font-size:13px;color:var(--text2);margin-top:2px">${s.city} · ${s.group}</div>
            ${clocs.length?`<div style="font-size:11px;color:var(--text2);margin-top:3px">🩺 ${clocs.map(id=>ST.facs.find(f=>f.id===id)?.name||'').filter(Boolean).join(', ')}</div>`:''}
            ${olocs.length?`<div style="font-size:11px;color:var(--text2);margin-top:2px">🏥 ${olocs.map(id=>ST.facs.find(f=>f.id===id)?.name||'').filter(Boolean).join(', ')}</div>`:''}

        </div>
      </div>`;
    });
  });
  return h;
}

      <textarea class="fi" style="border:none;padding:0;background:none;font-size:14px;min-height:80px" placeholder="Notes about this surgeon…" onchange="upPref('${id}','general_notes',this.value)">${p.general_notes||''}</textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" onclick="openApptModal('${id}')">+ Appointment</button>

  if(ST.ssub==='prefs')return`<div style="padding:14px 12px"><div class="card">${[['implant','Implant system'],['glove_size','Glove size'],['approach','Approach'],['positioning','Positioning'],['instruments','Instruments']].map(([k,lbl])=>`<div style="margin-bottom:12px"><div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:4px">${lbl}</div><input class="fi" style="font-size:13px;padding:8px 10px" placeholder="${lbl}" value="${sp[k]||''}" onchange="upSP('${id}','${k}',this.value)"></div>`).join('')}<div><div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:4px">Notes</div><textarea class="fi" style="font-size:13px;padding:8px 10px" onchange="upSP('${id}','notes',this.value)">${sp.notes||''}</textarea></div></div></div>`;

  return'';

const _pd={};
async function saveEditSurg(id) {
  const s=SURGS.find(x=>x.id===id); if(!s)return;
  // Update name in roster
  const newName = gv('es-name').trim();
  if(!newName){alert('Name required');return;}
  s.name = newName;
  s.tier = +gv('es-tier');
  // Update prefs
  if(!ST.prefs[id]) ST.prefs[id]={surgeon_id:id};
  ST.prefs[id].phone = gv('es-phone');
  ST.prefs[id].clinic_locs = [gv('cl0'),gv('cl1'),gv('cl2')];
  ST.prefs[id].or_locs     = [gv('or0'),gv('or1'),gv('or2')];
  await dbSave('crm_prefs', ST.prefs[id]);
  cls();
  render();
}

function upPref(id,k,v2){if(!ST.prefs[id])ST.prefs[id]={surgeon_id:id};ST.prefs[id][k]=v2;clearTimeout(_pd[id]);_pd[id]=setTimeout(()=>dbSave('crm_prefs',ST.prefs[id]),900);}
function upSched(id,d,v2){if(!ST.prefs[id])ST.prefs[id]={surgeon_id:id};if(!ST.prefs[id].schedule)ST.prefs[id].schedule={};ST.prefs[id].schedule[d]=v2;clearTimeout(_pd[id+'s']);_pd[id+'s']=setTimeout(()=>dbSave('crm_prefs',ST.prefs[id]),900);}
function upSP(id,k,v2){if(!ST.prefs[id])ST.prefs[id]={surgeon_id:id};if(!ST.prefs[id].surgical_prefs)ST.prefs[id].surgical_prefs={};ST.prefs[id].surgical_prefs[k]=v2;clearTimeout(_pd[id+'p']);_pd[id+'p']=setTimeout(()=>dbSave('crm_prefs',ST.prefs[id]),900);}

function openAddSurgModal(){sheet(`<div class="sheet-title">Add surgeon</div><div class="fg"><label>Full name</label><input type="text" id="as-n" class="fi" placeholder="Dr. "></div><div class="fg"><label>City</label><input type="text" id="as-c" class="fi" list="as-cl"><datalist id="as-cl">${CITIES.map(c=>`<option value="${c}">`).join('')}</datalist></div><div class="fg"><label>Group / Practice</label><input type="text" id="as-g" class="fi"></div><div class="fg"><label>Tier</label><select id="as-t" class="fi"><option value="1">Tier 1 — Priority</option><option value="2">Tier 2 — Growth</option><option value="3" selected>Tier 3 — Pipeline</option></select></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="cls()">Cancel</button><button class="btn btn-blue" style="flex:1" onclick="saveNewSurg()">Add surgeon</button></div>`,'as-n');}
function saveNewSurg(){const name=gv('as-n').trim();if(!name){alert('Name required');return;}const s={id:'surg_'+Date.now(),name,city:gv('as-c'),group:gv('as-g'),tier:+gv('as-t')};SURGS.push(s);SURGS=asc(SURGS,'name');cls();const el=$('surg-results');if(el)el.innerHTML=buildSurgCards();}

function openKPModal(sid,eid){const ex=eid?(ST.sc[sid]||[]).find(c=>c.id===eid):null;sheet(`<div class="sheet-title">${ex?'Edit':'Add'} key contact</div><div class="fg"><label>Name</label><input type="text" id="kp-n" class="fi" value="${ex?ex.name:''}"></div><div class="fg"><label>Role</label><input type="text" id="kp-r" class="fi" list="kp-rl" value="${ex?ex.role:''}"><datalist id="kp-rl">${ROLES.map(r=>`<option value="${r}">`).join('')}</datalist></div><div class="fg"><label>Phone</label><input type="tel" id="kp-p" class="fi" value="${ex?ex.phone:''}"></div><div class="fg"><label>Email</label><input type="email" id="kp-e" class="fi" value="${ex?ex.email:''}"></div><div class="fg"><label>Best time to reach</label><input type="text" id="kp-b" class="fi" value="${ex?ex.best_time:''}"></div><div class="fg"><label>Notes</label><textarea id="kp-nt" class="fi">${ex?ex.notes:''}</textarea></div><div style="display:flex;gap:10px">${ex?`<button class="btn btn-red" style="flex:1" onclick="delKP('${sid}','${eid}')">Delete</button>`:`<button class="btn" style="flex:1" onclick="cls()">Cancel</button>`}<button class="btn btn-blue" style="flex:1" onclick="saveKP('${sid}','${eid||''}')">Save</button></div>`,'kp-n');}
async function saveKP(sid,eid){const name=gv('kp-n').trim();if(!name){alert('Name required');return;}const e={id:eid||'kp'+Date.now(),surgeon_id:sid,name,role:gv('kp-r'),phone:gv('kp-p'),email:gv('kp-e'),best_time:gv('kp-b'),notes:gv('kp-nt')};if(!ST.sc[sid])ST.sc[sid]=[];if(eid){const i=ST.sc[sid].findIndex(c=>c.id===eid);if(i>-1)ST.sc[sid][i]=e;}else ST.sc[sid].push(e);await dbSave('crm_surgeon_contacts',e);cls();const el=$('surg-sub');if(el)el.innerHTML=buildSurgSubContent(sid);refreshSubtabs();}
async function delKP(sid,cid){if(!confirm('Delete this contact?'))return;ST.sc[sid]=(ST.sc[sid]||[]).filter(c=>c.id!==cid);await dbDel('crm_surgeon_contacts',cid);cls();const el=$('surg-sub');if(el)el.innerHTML=buildSurgSubContent(sid);refreshSubtabs();}

function buildFacSubContent(id){
  const f=ST.facs.find(x=>x.id===id); if(!f)return'';

  if(ST.facsub==='surgeons'){

      <div style="font-size:12px;color:var(--text2);margin-bottom:12px">Surgeons are assigned here via their individual Edit page.</div>
      ${clinicSurgs.length?`<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">🩺 Clinic</div>${clinicSurgs.map(s=>`<div class="card card-tap" onclick="openSurg('${s.id}')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:14px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--text2)">${s.group}</div></div>${tbadge(s.tier)}</div></div>`).join('')}`:''}
      ${orSurgs.length?`<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin:${clinicSurgs.length?'14px':0} 0 8px">🏥 OR</div>${orSurgs.map(s=>`<div class="card card-tap" onclick="openSurg('${s.id}')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:14px;font-weight:700">${s.name}</div><div style="font-size:12px;color:var(--text2)">${s.group}</div></div>${tbadge(s.tier)}</div></div>`).join('')}`:''}
      ${!surgs.length?`<div class="empty" style="padding:32px 0"><span class="empty-icon">🔬</span>No surgeons assigned here yet.<br><small style="color:var(--text3)">Open a surgeon and tap Edit to assign them to this facility.</small></div>`:''}
    </div>`;}

  if(ST.facsub==='personnel'){
    const linked=ST.pers.filter(p=>persIds.includes(p.id));
    return`<div style="padding:14px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:13px;color:var(--text2)">${linked.length?linked.length+' contact'+(linked.length!==1?'s':''):'No personnel assigned'}</span>
        <button class="btn btn-blue btn-sm" onclick="openFacPersPicker('${id}')">Manage</button>
      </div>
      ${!linked.length?`<div class="empty" style="padding:32px 0"><span class="empty-icon">👥</span>No personnel assigned yet.<br>Tap Manage to add contacts.</div>`:linked.map(p=>`<div class="contact-card" onclick="openPersModal('${p.id}')"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div class="contact-name">${p.name}</div>${roleBadge(p.role)}</div>${p.phone?`<div class="contact-detail">📞 ${p.phone}</div>`:''}${p.account?`<div class="contact-detail" style="font-size:11px;color:var(--text3)">${p.account}</div>`:''}</div>`).join('')}
    </div>`;}
  return'';}

// ── FACILITY PERSONNEL PICKER ──────────────────────────────
function openFacPersPicker(fid){
  const current=ST.fac_pers[fid]||[];
  const sorted=asc(ST.pers,'name');
  const items=sorted.map(p=>{const checked=current.includes(p.id);return`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="toggleFacPers('${fid}','${p.id}')"><div id="fpc_${fid}_${p.id}" style="width:22px;height:22px;border-radius:50%;border:2px solid ${checked?'var(--blue)':'var(--border2)'};background:${checked?'var(--blue)':'none'};flex-shrink:0;display:flex;align-items:center;justify-content:center">${checked?`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">${p.name}</div><div style="font-size:12px;color:var(--text2)">${p.role} · ${p.account||''}</div></div></div>`;}).join('');
  sheet(`<div class="sheet-title">Assign Personnel</div><div style="font-size:13px;color:var(--text2);margin-bottom:14px">Tap to toggle contacts for this facility.</div><div>${items}</div><div style="margin-top:18px"><button class="btn btn-blue" style="width:100%" onclick="cls();refreshFacSub('${fid}')">Done</button></div>`);}

async function toggleFacPers(fid,pid){if(!ST.fac_pers[fid])ST.fac_pers[fid]=[];const idx=ST.fac_pers[fid].indexOf(pid);const c=document.getElementById(`fpc_${fid}_${pid}`);if(idx>-1){ST.fac_pers[fid].splice(idx,1);if(c){c.style.background='none';c.style.borderColor='var(--border2)';c.innerHTML='';}await delFacPersLink(fid,pid);}else{ST.fac_pers[fid].push(pid);if(c){c.style.background='var(--blue)';c.style.borderColor='var(--blue)';c.innerHTML=`<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}await saveFacPersLink(fid,pid);}}

function refreshFacSub(fid){const el=$('fac-sub');if(el)el.innerHTML=buildFacSubContent(fid);const pI=ST.fac_pers[fid]||[];document.querySelectorAll('.subtab[data-facsub="personnel"]').forEach(b=>{b.textContent='Personnel'+(pI.length?' ('+pI.length+')':'');});}

// ── FACILITY ADD/EDIT MODAL ────────────────────────────────
function openFacModal(eid){const ex=eid?ST.facs.find(f=>f.id===eid):null;sheet(`<div class="sheet-title">${ex?'Edit':'Add'} Facility</div><div class="fg"><label>Facility name</label><input type="text" id="fm-n" class="fi" value="${ex?ex.name:''}" placeholder="Hospital / clinic / ASC name"></div><div class="fg"><label>City</label><input type="text" id="fm-c" class="fi" list="fm-cl" value="${ex?ex.city:''}"><datalist id="fm-cl">${CITIES.map(c=>`<option value="${c}">`).join('')}</datalist></div><div class="fg"><label>Type</label><select id="fm-t" class="fi">${FAC_TYPES.map(t=>`<option value="${t}" ${ex&&ex.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fg"><label>Address</label><input type="text" id="fm-a" class="fi" value="${ex?ex.address:''}" placeholder="Street address"></div><div class="fg"><label>Phone</label><input type="tel" id="fm-p" class="fi" value="${ex?ex.phone:''}"></div><div class="fg"><label>Notes</label><textarea id="fm-nt" class="fi">${ex?ex.notes:''}</textarea></div><div style="display:flex;gap:10px">${ex?`<button class="btn btn-red" style="flex:1" onclick="delFac('${ex.id}')">Delete</button>`:`<button class="btn" style="flex:1" onclick="cls()">Cancel</button>`}<button class="btn btn-blue" style="flex:1" onclick="saveFac('${eid||''}')">Save</button></div>`,'fm-n');}
async function saveFac(eid){const name=gv('fm-n').trim();if(!name){alert('Name required');return;}const e={id:eid||'fac'+Date.now(),name,city:gv('fm-c'),type:gv('fm-t'),address:gv('fm-a'),phone:gv('fm-p'),notes:gv('fm-nt')};if(eid){const i=ST.facs.findIndex(f=>f.id===eid);if(i>-1)ST.facs[i]=e;}else ST.facs.push(e);await dbSave('crm_facilities',e);cls();ST.facid=e.id;render();}
async function delFac(id){if(!confirm('Delete this facility?'))return;ST.facs=ST.facs.filter(f=>f.id!==id);delete ST.fac_pers[id];try{await _SB.from('crm_facilities').delete().eq('id',id);}catch(e){console.error(e);}try{await _SB.from('crm_facility_personnel').delete().eq('facility_id',id);}catch(e){console.error(e);}cls();ST.facid=null;render();}

// ── PERSONNEL ──────────────────────────────────────────────
function buildPersPage(){const accts=['All',...new Set(asc(ST.pers,'account').map(p=>p.account))];return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div class="filter-bar" id="pers-pills">${accts.map(a=>`<button class="pill ${ST.pfilt===a?'on':''}" data-acct="${a}">${a==='All'?'All':a.split('–')[1]?.trim()||a}</button>`).join('')}</div><div id="pers-list" class="scrollable">${buildPersCards()}</div></div>`;}
function buildPersCards(){const filtered=asc(ST.pers,'name').filter(p=>ST.pfilt==='All'||p.account===ST.pfilt);const groups=[...new Set(asc(ST.pers,'account').map(p=>p.account))];let h='',shown=false;groups.forEach(g=>{const gf=filtered.filter(p=>p.account===g);if(!gf.length)return;shown=true;h+=`<span class="slbl">${g}</span>`;gf.forEach(p=>{const fl=Object.entries(ST.fac_pers).filter(([fid,pids])=>pids.includes(p.id)).map(([fid])=>ST.facs.find(f=>f.id===fid)?.name).filter(Boolean);h+=`<div class="contact-card" style="margin:0 12px 8px" onclick="openPersModal('${p.id}')"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div class="contact-name">${p.name}</div>${roleBadge(p.role)}</div>${p.phone?`<div class="contact-detail">📞 ${p.phone}</div>`:''}${p.email?`<div class="contact-detail">✉️ ${p.email}</div>`:''}${fl.length?`<div class="contact-detail" style="font-size:11px;color:var(--text3);margin-top:4px">🏥 ${fl.join(', ')}</div>`:''}</div>`;});});return shown?h:`<div class="empty"><span class="empty-icon">👥</span>No contacts found</div>`;}
function openPersModal(eid){const ex=eid?ST.pers.find(p=>p.id===eid):null;const allA=[...new Set([...ST.pers.map(p=>p.account),...ACCTS])].sort();sheet(`<div class="sheet-title">${ex?'Edit':'Add'} contact</div><div class="fg"><label>Name</label><input type="text" id="pm-n" class="fi" value="${ex?ex.name:''}"></div><div class="fg"><label>Account / Hospital</label><input type="text" id="pm-a" class="fi" list="pm-al" value="${ex?ex.account:''}"><datalist id="pm-al">${allA.map(a=>`<option value="${a}">`).join('')}</datalist></div><div class="fg"><label>Role</label><input type="text" id="pm-r" class="fi" list="pm-rl" value="${ex?ex.role:''}"><datalist id="pm-rl">${ROLES.map(r=>`<option value="${r}">`).join('')}</datalist></div><div class="fg"><label>Phone</label><input type="tel" id="pm-p" class="fi" value="${ex?ex.phone:''}"></div><div class="fg"><label>Email</label><input type="email" id="pm-e" class="fi" value="${ex?ex.email:''}"></div><div class="fg"><label>Best time to reach</label><input type="text" id="pm-b" class="fi" value="${ex?ex.best_time:''}"></div><div class="fg"><label>Notes</label><textarea id="pm-nt" class="fi">${ex?ex.notes:''}</textarea></div><div style="display:flex;gap:10px">${ex?`<button class="btn btn-red" style="flex:1" onclick="delPers('${ex.id}')">Delete</button>`:`<button class="btn" style="flex:1" onclick="cls()">Cancel</button>`}<button class="btn btn-blue" style="flex:1" onclick="savePers('${eid||''}')">Save</button></div>`,'pm-n');}
async function savePers(eid){const name=gv('pm-n').trim();if(!name){alert('Name required');return;}const e={id:eid||'p'+Date.now(),name,account:gv('pm-a'),role:gv('pm-r'),phone:gv('pm-p'),email:gv('pm-e'),best_time:gv('pm-b'),notes:gv('pm-nt')};if(eid){const i=ST.pers.findIndex(p=>p.id===eid);if(i>-1)ST.pers[i]=e;}else ST.pers.push(e);await dbSave('crm_personnel',e);cls();refreshPersPills();const el=$('pers-list');if(el)el.innerHTML=buildPersCards();}
async function delPers(id){if(!confirm('Delete this contact?'))return;ST.pers=ST.pers.filter(p=>p.id!==id);await dbDel('crm_personnel',id);cls();refreshPersPills();const el=$('pers-list');if(el)el.innerHTML=buildPersCards();}

// ── SCHEDULE ───────────────────────────────────────────────
function buildSchedPage(){return`<div style="display:flex;flex-direction:column;height:100%;overflow:hidden"><div class="filter-bar" id="sched-bar"><button class="pill ${ST.afilt==='upcoming'?'on':''}" data-afilt="upcoming">Upcoming</button><button class="pill ${ST.afilt==='all'?'on':''}" data-afilt="all">All</button><button class="pill ${ST.afilt==='past'?'on':''}" data-afilt="past">Past</button></div><div id="sched-list" class="scrollable">${buildSchedCards()}</div></div>`;}
function buildSchedCards(){const now=new Date();now.setHours(0,0,0,0);let list=[...ST.appts];if(ST.afilt==='upcoming')list=list.filter(a=>new Date(a.date+'T00:00:00')>=now);else if(ST.afilt==='past')list=list.filter(a=>new Date(a.date+'T00:00:00')<now);list.sort((a,b)=>ST.afilt==='past'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));if(!list.length)return`<div class="empty"><span class="empty-icon">📅</span>No appointments</div>`;return list.map(a=>{const dt=new Date(a.date+'T00:00:00'),ip=dt<now;return`<div class="card"><div class="row"><div class="date-box"><div class="date-month">${dt.toLocaleDateString('en-US',{month:'short'})}</div><div class="date-day">${dt.getDate()}</div></div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="font-size:15px;font-weight:700">${a.title}</div><span class="tag ${ip?'tag-past':'tag-up'}">${ip?'Past':'Soon'}</span></div>${a.surgeon_name?`<div style="font-size:13px;color:var(--text2)">${a.surgeon_name}</div>`:''}${a.start_time?`<div style="font-size:13px;color:var(--text2)">${a.start_time}${a.end_time?' – '+a.end_time:''}</div>`:''}${a.location?`<div style="font-size:13px;color:var(--text2)">📍 ${a.location}</div>`:''}${a.notes?`<div style="font-size:13px;color:var(--text3);margin-top:3px">${a.notes}</div>`:''}<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" onclick="makeICS(${JSON.stringify(a.title)},'${a.date}','${a.start_time||''}','${a.end_time||''}',${JSON.stringify(a.location||'')},${JSON.stringify(a.notes||'')})">⬇ Add to Calendar</button><button class="btn btn-red btn-sm" onclick="delAppt('${a.id}')">Delete</button></div></div></div></div>`;}).join('');}
function openApptModal(sid){const sl=asc(SURGS,'name');sheet(`<div class="sheet-title">Add appointment</div><div class="fg"><label>Title</label><input type="text" id="am-ti" class="fi" placeholder="OR coverage, lunch, in-service…"></div><div class="fg"><label>Surgeon (optional)</label><select id="am-s" class="fi"><option value="">None</option>${sl.map(x=>`<option value="${x.id}" ${x.id===sid?'selected':''}>${x.name} — ${x.city}</option>`).join('')}</select></div><div class="fg"><label>Type</label><select id="am-ty" class="fi"><option>In-service</option><option>Lunch</option><option>Meeting</option><option>Office Visit</option><option>OR Coverage</option><option>Other</option></select></div><div class="fg"><label>Date</label><input type="date" id="am-d" class="fi" value="${tod()}"></div><div class="form-row"><div class="fg"><label>Start time</label><input type="time" id="am-st" class="fi"></div><div class="fg"><label>End time</label><input type="time" id="am-et" class="fi"></div></div><div class="fg"><label>Location</label><input type="text" id="am-l" class="fi" placeholder="Hospital / clinic name"></div><div class="fg"><label>Notes</label><textarea id="am-n" class="fi"></textarea></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="cls()">Cancel</button><button class="btn btn-blue" style="flex:1" onclick="saveAppt()">Save & download .ics</button></div>`,'am-ti');}
async function saveAppt(){const title=gv('am-ti').trim();if(!title){alert('Title required');return;}const sid=gv('am-s'),surg=sid?SURGS.find(x=>x.id===sid):null;const date=gv('am-d'),st=gv('am-st'),et=gv('am-et'),loc=gv('am-l'),notes=gv('am-n');const e={id:'a'+Date.now(),title,surgeon_id:sid,surgeon_name:surg?surg.name:'',type:gv('am-ty'),date,start_time:st,end_time:et,location:loc,notes};ST.appts.push(e);await dbSave('crm_appts',e);makeICS(title,date,st,et,loc,notes);cls();const el=$('sched-list');if(el)el.innerHTML=buildSchedCards();}
async function delAppt(id){if(!confirm('Delete?'))return;ST.appts=ST.appts.filter(a=>a.id!==id);await dbDel('crm_appts',id);const el=$('sched-list');if(el)el.innerHTML=buildSchedCards();}

// ── CALLS ──────────────────────────────────────────────────
function buildCallsPage(){const sorted=[...ST.logs].sort((a,b)=>b.date.localeCompare(a.date));if(!sorted.length)return`<div class="scrollable"><div class="empty"><span class="empty-icon">📞</span>No call logs yet</div></div>`;return`<div class="scrollable">${sorted.map(l=>{const s=SURGS.find(x=>x.id===l.surgeon_id);return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px"><div style="font-size:15px;font-weight:700">${l.surgeon_name}</div><span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--bg2);color:var(--text2)">${l.type||'Call'}</span></div>${s?`<div style="font-size:13px;color:var(--text2)">${s.group} · ${s.city}</div>`:''}<div style="font-size:12px;color:var(--text3);margin-top:2px">${fmtDate(l.date)}</div>${l.notes?`<div style="font-size:14px;margin-top:7px;line-height:1.5">${l.notes}</div>`:''} ${l.next_call?`<div style="font-size:13px;color:var(--text2);margin-top:6px">Follow up: ${fmtDate(l.next_call)} <button class="btn btn-xs" onclick="makeICS('Follow-up: ${l.surgeon_name}','${l.next_call}','','','','')">⬇ .ics</button></div>`:''}<button class="btn btn-red btn-sm" style="margin-top:9px" onclick="delLog('${l.id}',null)">Delete</button></div>`;}).join('')}</div>`;}
function openLogModal(sid){const sl=asc(SURGS,'name');sheet(`<div class="sheet-title">Log call or visit</div><div class="fg"><label>Surgeon</label><select id="lm-s" class="fi"><option value="">Select surgeon…</option>${sl.map(x=>`<option value="${x.id}" ${x.id===sid?'selected':''}>${x.name} — ${x.city}</option>`).join('')}</select></div><div class="fg"><label>Type</label><select id="lm-t" class="fi"><option>Call</option><option>Email</option><option>In-service</option><option>Lunch</option><option>Office Visit</option><option>OR Visit</option></select></div><div class="form-row"><div class="fg"><label>Date</label><input type="date" id="lm-d" class="fi" value="${tod()}"></div><div class="fg"><label>Follow-up date</label><input type="date" id="lm-n" class="fi"></div></div><div class="fg"><label>Notes</label><textarea id="lm-nt" class="fi" placeholder="What happened? Key takeaways…"></textarea></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="cls()">Cancel</button><button class="btn btn-blue" style="flex:1" onclick="saveLog()">Save log</button></div>`,'lm-nt');}
async function saveLog(){const sid=gv('lm-s');const surg=SURGS.find(x=>x.id===sid);if(!sid){alert('Select a surgeon');return;}const e={id:'l'+Date.now(),surgeon_id:sid,surgeon_name:surg.name,type:gv('lm-t'),date:gv('lm-d'),next_call:gv('lm-n')||null,notes:gv('lm-nt')};ST.logs.unshift(e);await dbSave('crm_logs',e);cls();if(ST.sid){const el=$('surg-sub');if(el)el.innerHTML=buildSurgSubContent(ST.sid);refreshSubtabs();}else render();}
async function delLog(id,sid){if(!confirm('Delete?'))return;ST.logs=ST.logs.filter(l=>l.id!==id);await dbDel('crm_logs',id);if(sid){const el=$('surg-sub');if(el)el.innerHTML=buildSurgSubContent(sid);refreshSubtabs();}else render();}

// ── MODAL SHEET ────────────────────────────────────────────
function sheet(inner,focusId){cls();const el=document.createElement('div');el.className='overlay';el.onclick=e=>{if(e.target===el)el.remove();};el.innerHTML=`<div class="sheet"><div class="sheet-handle"></div>${inner}</div>`;document.body.appendChild(el);if(focusId)setTimeout(()=>{const f=$(focusId);if(f)f.focus();},100);}
function cls(){document.querySelectorAll('.overlay').forEach(e=>e.remove());}

// ── EVENT DELEGATION ───────────────────────────────────────
function attachDelegation(){
  const sp=$('surg-pills');
  if(sp&&!sp._del){sp._del=true;sp.addEventListener('click',e=>{const b=e.target.closest('[data-city]');if(!b)return;setSFilt(b.dataset.city);});}
  const pp=$('pers-pills');
  if(pp&&!pp._del){pp._del=true;pp.addEventListener('click',e=>{const b=e.target.closest('[data-acct]');if(!b)return;setPFilt(b.dataset.acct);});}
  const sb=$('sched-bar');
  if(sb&&!sb._del){sb._del=true;sb.addEventListener('click',e=>{const b=e.target.closest('[data-afilt]');if(!b)return;setAFilt(b.dataset.afilt);});}
  const tb=$('task-bar');
  if(tb&&!tb._del){tb._del=true;tb.addEventListener('click',e=>{const b=e.target.closest('[data-tfilt]');if(!b)return;setTFilt(b.dataset.tfilt);});}
  const fp=$('fac-city-pills');
  if(fp&&!fp._del){fp._del=true;fp.addEventListener('click',e=>{const b=e.target.closest('[data-facfilt]');if(!b)return;setFacFilt(b.dataset.facfilt);});}
}

// ── BOOT ──────────────────────────────────────────────────
setSyncUI('saving');
dbLoad();
</script>
</body>
</html>
